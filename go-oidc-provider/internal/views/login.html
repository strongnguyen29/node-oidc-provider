<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Login</title>
<style>body{font-family:sans-serif;max-width:400px;margin:80px auto;padding:0 20px}
input{width:100%;padding:8px;margin:6px 0;box-sizing:border-box}
button{width:100%;padding:10px;background:#0070f3;color:#fff;border:none;cursor:pointer;font-size:16px}
.err{color:red;margin:8px 0}</style>
</head>
<body>
<h2>Sign In</h2>
{{if .Error}}<p class="err">{{.Error}}</p>{{end}}
<form method="POST" action="/interaction/{{.UID}}/login">
  <input type="hidden" name="uid" value="{{.UID}}">
  <label>Username<input type="text" name="login" autocomplete="username" required></label>
  <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
  <button type="submit">Sign In</button>
</form>
</body>
</html>
