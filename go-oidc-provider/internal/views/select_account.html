<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Select Account</title>
<style>body{font-family:sans-serif;max-width:400px;margin:80px auto;padding:0 20px}
.btn{width:100%;padding:10px;margin:6px 0;cursor:pointer;font-size:14px;background:#0070f3;color:#fff;border:none}</style>
</head>
<body>
<h2>Select Account</h2>
<p>Continue as <strong>{{.AccountID}}</strong>?</p>
<form method="POST" action="/interaction/{{.UID}}/login">
  <input type="hidden" name="uid" value="{{.UID}}">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <input type="hidden" name="use_existing" value="1">
  <button type="submit" class="btn">Continue as {{.AccountID}}</button>
</form>
<a href="/interaction/{{.UID}}/login?switch=1">Use a different account</a>
</body>
</html>
